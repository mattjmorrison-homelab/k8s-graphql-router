apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: graphql-router
spec:
  provider:
    vault:
      server: http://homelab-openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: graphql-router
          serviceAccountRef:
            name: graphql-router
